<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giám Sát Thiên Tai</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; text-align: center; margin: 0; padding: 20px; color: #333; }
        h1 { color: #1a237e; margin-bottom: 5px; }
        
        .status-bar { margin: 15px 0; }
        .badge { padding: 6px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 10px; display: inline-block; transition: 0.3s;}
        .bg-green { background: #c8e6c9; color: #2e7d32; }
        .bg-gray { background: #e0e0e0; color: #666; }
        .bg-red { background: #ffcdd2; color: #c62828; }
        
        #alert-box { font-size: 22px; font-weight: bold; padding: 15px; max-width: 600px; margin: 0 auto 20px; border-radius: 8px; transition: 0.3s; background-color: white; border: 1px solid #ccc;}

        .dashboard { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 220px; }
        .card h3 { margin: 0; font-size: 14px; color: #666; text-transform: uppercase; }
        .card h2 { margin: 10px 0 0 0; font-size: 36px; color: #2c3e50; }
        .card p { margin: 8px 0 0 0; font-size: 12px; color: #2196f3; font-weight: bold;}

        .danger { background-color: #ffebee !important; color: #c62828 !important; border: 2px solid #ef5350 !important; }
        .warning { background-color: #fff3e0 !important; border: 2px solid #ff9800 !important; }

        .section-title { margin-top: 40px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; color: #555; border-bottom: 2px solid #ccc; display: inline-block; padding-bottom: 5px;}
        
        .charts-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; width: 95%; max-width: 1200px; margin: 0 auto; margin-bottom: 30px;}
        .chart-container { flex: 1 1 45%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-width: 300px; height: 300px; }
    </style>
</head>
<body>

    <h1>HỆ THỐNG GIÁM SÁT THIÊN TAI</h1>
    
    <div class="status-bar">
        <div id="status-mqtt" class="badge bg-gray">MQTT: Đang kết nối...</div>
        <div id="status-http" class="badge bg-gray">ThingSpeak: Đang tải...</div>
    </div>
    
    <div id="alert-box">Đang khởi tạo hệ thống...</div>

    <div class="dashboard">
        <div class="card" id="card-soil">
            <h3>Độ ẩm đất</h3>
            <h2 id="val-soil">-- %</h2>
            <p id="time-soil">Cập nhật: --:--:--</p>
        </div>
        <div class="card" id="card-vib">
            <h3>Rung chấn</h3>
            <h2 id="val-vib">-- m/s²</h2>
            <p id="time-vib">Cập nhật: --:--:--</p>
        </div>
    </div>

    <!-- KHU VỰC BIỂU ĐỒ HTTP -->
    <h3 class="section-title">Lịch sử ThingSpeak (HTTP - 30 giây/lần)</h3>
    <div class="charts-row">
        <div class="chart-container"><canvas id="httpSoilChart"></canvas></div>
        <div class="chart-container"><canvas id="httpVibChart"></canvas></div>
    </div>

    <!-- KHU VỰC BIỂU ĐỒ MQTT -->
    <h3 class="section-title">Giám sát Trực tiếp (MQTT - 15 giây/lần)</h3>
    <div class="charts-row">
        <div class="chart-container"><canvas id="mqttSoilChart"></canvas></div>
        <div class="chart-container"><canvas id="mqttVibChart"></canvas></div>
    </div>

    <script>
        // ==========================================
        // 1. CẤU HÌNH KẾT NỐI 
        // ==========================================
        const TS_CHANNEL_ID = "3349950"; 
        const TS_READ_API_KEY = "J19ZUM4EVA7CGQLJ"; 
        
        const MQTT_BROKER = "broker.hivemq.com";
        const MQTT_PORT = 8884; 
        const MQTT_TOPIC = "thientai/giamsat/vuhuytuan_12345"; 

        let currentVib = 0;
        let currentSoil = 0;
        
        // ==========================================
        // 2. KHỞI TẠO BIỂU ĐỒ
        // ==========================================
        function createChart(ctxId, label, color) {
            return new Chart(document.getElementById(ctxId).getContext('2d'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: label, borderColor: color, backgroundColor: color.replace('1)', '0.15)'), borderWidth: 2, pointRadius: 3, fill: true, data: [] }] },
                options: { responsive: true, maintainAspectRatio: false, animation: { duration: 0 } }
            });
        }

        const httpSoilChart = createChart('httpSoilChart', 'Độ ẩm (ThingSpeak HTTP)', 'rgba(33, 150, 243, 1)'); 
        const httpVibChart  = createChart('httpVibChart', 'Rung chấn (ThingSpeak HTTP)', 'rgba(244, 67, 54, 1)'); 

        const mqttSoilChart = createChart('mqttSoilChart', 'Độ ẩm (HiveMQ MQTT)', 'rgba(156, 39, 176, 1)'); 
        const mqttVibChart  = createChart('mqttVibChart', 'Rung chấn (HiveMQ MQTT)', 'rgba(255, 152, 0, 1)'); 

        function pushDataToChart(chart, time, value, maxPoints) {
            chart.data.labels.push(time);
            chart.data.datasets[0].data.push(value);
            if (chart.data.labels.length > maxPoints) {
                chart.data.labels.shift(); chart.data.datasets[0].data.shift();
            }
            chart.update();
        }

        function updateCardsUI(time) {
            document.getElementById('val-soil').innerText = currentSoil + " %";
            document.getElementById('val-vib').innerText  = currentVib + " m/s²";
            document.getElementById('time-soil').innerText = "Cập nhật: " + time;
            document.getElementById('time-vib').innerText = "Cập nhật: " + time;
        }

        // ==========================================
        // 3. HÀM CẬP NHẬT CẢNH BÁO
        // ==========================================
        function updateAlertBox() {
            const alertBox = document.getElementById('alert-box');
            document.querySelectorAll('.card').forEach(c => { c.classList.remove('danger', 'warning'); });

            if (currentVib >= 8.5) { 
                document.getElementById('card-vib').classList.add('danger');
                alertBox.innerText = "🚨 ĐỘNG ĐẤT: KHẨN CẤP 🚨";
                alertBox.style.backgroundColor = "#ffcdd2"; alertBox.style.color = "#c62828"; alertBox.style.borderColor = "#c62828";
            } 
            else if (currentSoil >= 70) { 
                document.getElementById('card-soil').classList.add('danger');
                alertBox.innerText = "⚠️ SẠT LỞ: CẢNH BÁO MỨC ĐỘ CAO ⚠️";
                alertBox.style.backgroundColor = "#ffe0b2"; alertBox.style.color = "#e65100"; alertBox.style.borderColor = "#e65100";
            } 
            else if (currentVib >= 6.5) { 
                document.getElementById('card-vib').classList.add('warning');
                alertBox.innerText = "Chú ý: Ghi nhận rung chấn bất thường";
                alertBox.style.backgroundColor = "#fff3e0"; alertBox.style.color = "#ef6c00"; alertBox.style.borderColor = "#ff9800";
            } 
            else {
                alertBox.innerText = "✅ Hệ thống đang trong trạng thái an toàn";
                alertBox.style.backgroundColor = "#c8e6c9"; alertBox.style.color = "#2e7d32"; alertBox.style.borderColor = "#4caf50";
            }
        }

        // ==========================================
        // 4. LUỒNG HTTP (THINGSPEAK) - ĐÃ CẬP NHẬT CHỐNG NHẢY DỮ LIỆU CŨ
        // ==========================================
        let lastEntryId = null; // Biến nhớ ID dòng dữ liệu cuối

        async function fetchThingSpeakData() {
            const url = `https://api.thingspeak.com/channels/${TS_CHANNEL_ID}/feeds.json?api_key=${TS_READ_API_KEY}&results=1`;
            const statusHttp = document.getElementById('status-http');
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("HTTP " + response.status);
                
                const data = await response.json();
                if (data.feeds && data.feeds.length > 0) {
                    const feed = data.feeds[0]; 
                    
                    // Chỉ vẽ biểu đồ khi có dữ liệu mới (entry_id tăng lên)
                    if (lastEntryId === null || feed.entry_id > lastEntryId) {
                        lastEntryId = feed.entry_id; 
                        
                        const httpSoil = parseFloat(feed.field1) || 0;
                        const httpVib = parseFloat(feed.field2) || 0;
                        
                        // Lấy thời gian lúc dữ liệu được tạo trên Server
                        const time = new Date(feed.created_at).toLocaleTimeString();

                        pushDataToChart(httpSoilChart, time, httpSoil, 10);
                        pushDataToChart(httpVibChart, time, httpVib, 10);

                        statusHttp.innerText = "ThingSpeak: Đã lưu (" + time + ")";
                        statusHttp.className = "badge bg-green";
                    } else {
                        // Mạch đang dừng, không vẽ biểu đồ, chỉ báo trạng thái
                        statusHttp.innerText = "ThingSpeak: Chờ dữ liệu mới...";
                        statusHttp.className = "badge bg-gray";
                    }
                }
            } catch (error) { 
                statusHttp.innerText = "ThingSpeak: Lỗi kết nối";
                statusHttp.className = "badge bg-red";
            }
        }

        setInterval(fetchThingSpeakData, 30000); 
        fetchThingSpeakData(); 

        // ==========================================
        // 5. LUỒNG MQTT (HIVEMQ)
        // ==========================================
        const clientId = "WebHybrid-" + Math.random().toString(16).substr(2, 8);
        const mqttClient = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, clientId);

        mqttClient.onConnectionLost = function(res) {
            document.getElementById('status-mqtt').className = "badge bg-red";
            document.getElementById('status-mqtt').innerText = "MQTT: Mất kết nối";
            setTimeout(startMqtt, 3000);
        };

        mqttClient.onMessageArrived = function(message) {
            try {
                const data = JSON.parse(message.payloadString);
                const time = new Date().toLocaleTimeString();

                currentSoil = data.soil || 0;
                currentVib = data.vib || 0;

                updateCardsUI(time);
                updateAlertBox(); 
                
                pushDataToChart(mqttSoilChart, time, currentSoil, 20);
                pushDataToChart(mqttVibChart, time, currentVib, 20);

            } catch (e) { console.error("Lỗi JSON MQTT: ", e); }
        };

        function startMqtt() {
            mqttClient.connect({
                timeout: 5, useSSL: true,
                onSuccess: function() {
                    document.getElementById('status-mqtt').className = "badge bg-green";
                    document.getElementById('status-mqtt').innerText = "MQTT: Real-time OK";
                    mqttClient.subscribe(MQTT_TOPIC); 
                },
                onFailure: function() { setTimeout(startMqtt, 3000); }
            });
        }

        startMqtt();
    </script>
</body>
</html>
